# Dark Matter — auto-deploy the backend to EC2 on every push to main.
#
# How it works: any push to main that touches backend/ (or this file) SSHes
# into the EC2 box, pulls the latest main, installs backend deps, and
# restarts the darkmatter-backend systemd service. The frontend already
# auto-deploys via Cloudflare Pages, so after this both halves deploy
# themselves on `git push`.
#
# One-time setup (repo Settings → Secrets and variables → Actions → New secret):
#   EC2_HOST     the EC2 public IP or hostname (e.g. 13.233.230.240)
#   EC2_USER     the SSH user (e.g. ubuntu)
#   EC2_SSH_KEY  the PRIVATE key that can SSH into that box (the whole
#                -----BEGIN ... PRIVATE KEY----- ... -----END block).
#                Use a dedicated deploy key if you can; keep it out of chat.
#
# The deploy user needs passwordless sudo for systemctl, or run the service
# restart via a sudoers rule, e.g. on EC2:
#   echo "ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl restart darkmatter-backend, /bin/systemctl is-active darkmatter-backend" | sudo tee /etc/sudoers.d/dark-matter-deploy

name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Pull + restart on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/Dark-Matter
            echo "--- pulling latest main ---"
            git pull --ff-only
            echo "--- backend deps ---"
            cd backend
            npm ci --omit=dev
            echo "--- checking for active hunts ---"
            ACTIVE=$(node -e "
              import('./src/store.js').then((s) => {
                const ms = s.listHuntMetas();
                const active = ms.filter((m) => ['running','created','starting','paused'].includes(m.state) && !['stopped','finished','failed'].includes(m.state));
                console.log(active.length);
              }).catch(() => console.log(0));
            " 2>/dev/null || echo 0)
            if [ "${ACTIVE}" != "0" ]; then
              echo "SKIP restart: ${ACTIVE} hunt(s) still active — new code is pulled and will apply on the next manual restart."
              git rev-parse --short HEAD
              exit 0
            fi
            echo "--- restarting backend (no active hunts) ---"
            sudo systemctl restart darkmatter-backend
            sleep 10
            sudo systemctl is-active darkmatter-backend
            echo "--- health check ---"
            curl -sf http://localhost:4000/api/v1/health
            echo
            echo "--- deployed revision ---"
            git rev-parse --short HEAD
