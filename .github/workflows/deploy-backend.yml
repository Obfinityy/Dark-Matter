# Dark Matter — auto-deploy the backend to EC2 on every push to main.
#
# How it works: any push to main that touches backend/ (or this file) SSHes
# into the EC2 box, pulls the latest main, installs backend deps, and
# restarts the darkmatter-backend systemd service. The frontend already
# auto-deploys via Cloudflare Pages, so after this both halves deploy
# themselves on `git push`.
#
# One-time setup (repo Settings → Secrets and variables → Actions → New secret):
#   EC2_HOST     the EC2 public IP or hostname (e.g. 13.233.230.240)
#   EC2_USER     the SSH user (e.g. ubuntu)
#   EC2_SSH_KEY  the PRIVATE key that can SSH into that box (the whole
#                -----BEGIN ... PRIVATE KEY----- ... -----END block).
#                Use a dedicated deploy key if you can; keep it out of chat.
#   META_API_KEY the Meta Model API key for the hunt brain (the owner
#                sets it in repo Settings — never in chat). Written
#                into /opt/Dark-Matter/backend/.env by the workflow
#                step below, before the backend restarts. Optional:
#                the step skips cleanly while the secret is unset.
#
# The deploy user needs passwordless sudo for systemctl, or run the service
# restart via a sudoers rule, e.g. on EC2:
#   echo "ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl restart darkmatter-backend, /bin/systemctl is-active darkmatter-backend" | sudo tee /etc/sudoers.d/dark-matter-deploy

name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Pull + restart on EC2
    runs-on: ubuntu-latest
    steps:
      # META_API_KEY (27 Oct 2026, owner decision): the Meta model key
      # lives as a GitHub repo secret of that name (the owner sets it
      # in repo Settings — never in chat). This step writes it into
      # /opt/Dark-Matter/backend/.env on EC2 BEFORE the deploy step,
      # so a restarted backend reads it. The secret is piped to ssh
      # on stdin and read by `cat` on the far side — it never appears
      # in the command string, and nothing here ever prints it; the
      # only output is the COUNT of META_API_KEY lines (1 = present).
      # Idempotent: any existing line is removed first, then exactly
      # one is appended (the .env file itself is never replaced, so
      # its owner/permissions survive). If the secret is not set yet,
      # the step skips cleanly. If the write fails, it warns and lets
      # the deploy continue — a missing optional key must never block
      # a code deploy.
      - name: Write Meta API key to EC2 .env
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${META_API_KEY:-}" ]; then
            echo "META_API_KEY secret not set — skipping (backend keeps its existing .env)"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          if printf '%s' "$META_API_KEY" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            'key=$(cat); envfile=/opt/Dark-Matter/backend/.env; touch "$envfile"; tmpfile=$(mktemp); grep -v "^META_API_KEY[[:space:]]*=" "$envfile" > "$tmpfile"; printf "META_API_KEY=%s\n" "$key" >> "$tmpfile"; cat "$tmpfile" > "$envfile"; rm -f "$tmpfile"; echo "META_API_KEY lines: $(grep -c "^META_API_KEY[[:space:]]*=" "$envfile")"'; then
            echo "META_API_KEY written to EC2 .env"
          else
            echo "::warning::META_API_KEY could not be written to EC2 .env — the deploy continues without it; set the secret and re-run, or write the key by hand"
          fi
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/Dark-Matter
            echo "--- pulling latest main ---"
            git pull --ff-only
            echo "--- backend deps ---"
            cd backend
            npm ci --omit=dev
            echo "--- checking for active hunts ---"
            ACTIVE=$(node -e "
              import('./src/store.js').then((s) => {
                const ms = s.listHuntMetas();
                const active = ms.filter((m) => ['running','created','starting','paused'].includes(m.state) && !['stopped','finished','failed'].includes(m.state));
                console.log(active.length);
              }).catch(() => console.log(0));
            " 2>/dev/null || echo 0)
            if [ "${ACTIVE}" != "0" ]; then
              echo "SKIP restart: ${ACTIVE} hunt(s) still active — new code is pulled and will apply on the next manual restart."
              git rev-parse --short HEAD
              exit 0
            fi
            echo "--- restarting backend (no active hunts) ---"
            sudo systemctl restart darkmatter-backend
            sleep 10
            sudo systemctl is-active darkmatter-backend
            echo "--- health check ---"
            curl -sf http://localhost:4000/api/v1/health
            echo
            echo "--- deployed revision ---"
            git rev-parse --short HEAD
