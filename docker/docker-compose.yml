# Dark Matter hunt engine stack — for the USER'S LINUX MACHINE.
# Services: engine (PentAGI Go backend, backend-only image) + pgvector (Postgres + pgvector).
# The engine spawns pentest tool sandboxes through the host Docker socket.
#
# Usage: ./setup-linux.sh   (creates .env from .env.example, builds, starts, mints ENGINE_TOKEN)

name: darkmatter-engine

volumes:
  dm-engine-data:
    driver: local
  dm-pgvector-data:
    driver: local

networks:
  dm-engine-net:
    driver: bridge
    name: dm-engine-net

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: dm-engine-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pentagiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pentagidb}
    volumes:
      - dm-pgvector-data:/var/lib/postgresql/data
    networks:
      - dm-engine-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pentagiuser} -d $${POSTGRES_DB:-pentagidb}"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    image: darkmatter/engine:latest
    container_name: dm-engine
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    # Lets the engine reach services on the host (e.g. host Ollama) via
    # http://host.docker.internal:<port>. Set LLM_BASE_URL accordingly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The hunt sandbox needs the host Docker daemon to run pentest tool containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - dm-engine-data:/opt/pentagi/data
    environment:
      SERVER_PORT: "8080"
      SERVER_USE_SSL: "false"
      DATA_DIR: /opt/pentagi/data
      DATABASE_URL: postgres://${POSTGRES_USER:-pentagiuser}:${POSTGRES_PASSWORD}@pgvector:5432/${POSTGRES_DB:-pentagidb}?sslmode=disable
      COOKIE_SIGNING_SALT: ${COOKIE_SIGNING_SALT:?set COOKIE_SIGNING_SALT in .env (generated by setup-linux.sh)}
      TENANT_ID: ${TENANT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # --- LLM: custom OpenAI-compatible provider (Ollama default; no external key needed) ---
      LLM_SERVER_URL: ${LLM_BASE_URL:-http://localhost:11434/v1}
      LLM_SERVER_KEY: ${LLM_API_KEY:-ollama}
      LLM_SERVER_MODEL: ${LLM_MODEL:-qwen3:32b}
      # NOTE: LLM_BASE_URL points at the LLM server as seen FROM INSIDE the
      # engine container. For Ollama on the same host use
      # http://host.docker.internal:11434/v1 (Linux: add
      # "add_hosts: host.docker.internal:host-gateway") or run Ollama in this
      # compose network. The default assumes an Ollama reachable at
      # host.docker.internal — see README.
      DOCKER_DEFAULT_IMAGE: ${DOCKER_DEFAULT_IMAGE:-debian:latest}
      DEBUG: ${DEBUG:-false}
    networks:
      - dm-engine-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
